<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GRAEI Agent DNA Builder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0c12;color:#E2E2E2;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
/* TOP BAR */
.topbar{background:rgba(13,17,23,0.95);border-bottom:1px solid rgba(0,242,255,0.2);padding:0 24px;height:48px;display:flex;align-items:center;gap:20px;flex-shrink:0;}
.topbar-title{font-size:1rem;font-weight:800;color:#00f2ff;letter-spacing:0.08em;}
.topbar-sub{font-size:0.78rem;color:#8892B0;}
.topbar-actions{margin-left:auto;display:flex;gap:10px;}
.btn-primary{background:linear-gradient(135deg,#00f2ff,#005eff);color:#0d1117;border:none;padding:8px 18px;border-radius:10px;font-weight:800;cursor:pointer;font-size:0.82rem;}
.btn-ghost{background:rgba(255,255,255,0.06);color:#A1C1D1;border:1px solid rgba(255,255,255,0.12);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:0.82rem;}
/* MAIN LAYOUT */
.main{display:flex;flex:1;overflow:hidden;}
/* AGENT LIST SIDEBAR */
.sidebar{width:240px;background:rgba(13,17,23,0.9);border-right:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-head{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;justify-content:space-between;align-items:center;}
.sidebar-head span{font-size:0.72rem;color:#8892B0;letter-spacing:0.1em;}
.add-agent-btn{background:linear-gradient(135deg,#70E100,#3d8a00);color:#fff;border:none;padding:6px 12px;border-radius:8px;font-size:0.78rem;font-weight:700;cursor:pointer;}
.agent-list{flex:1;overflow-y:auto;padding:8px;}
.agent-chip{padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.03);cursor:pointer;margin-bottom:6px;transition:all 0.2s;}
.agent-chip:hover,.agent-chip.active{background:rgba(0,242,255,0.1);border-color:rgba(0,242,255,0.3);}
.agent-chip-name{font-size:0.85rem;font-weight:600;color:#E2E2E2;}
.agent-chip-role{font-size:0.72rem;color:#8892B0;margin-top:2px;}
.agent-chip-bar{height:3px;border-radius:2px;margin-top:6px;background:rgba(255,255,255,0.06);}
.agent-chip-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#70E100,#00f2ff);}
/* EDITOR AREA */
.editor{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px;}
/* STEP CARDS */
.step-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;}
.step-header{padding:12px 18px;background:rgba(0,0,0,0.3);border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:10px;}
.step-num{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#00f2ff,#005eff);color:#0d1117;font-size:0.75rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-title{font-size:0.88rem;font-weight:700;color:#A1C1D1;}
.step-body{padding:18px;}
/* ROLE GRID */
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.role-btn{padding:12px 10px;border:2px solid rgba(255,255,255,0.08);border-radius:10px;background:rgba(255,255,255,0.03);cursor:pointer;text-align:center;transition:all 0.2s;}
.role-btn:hover{background:rgba(0,242,255,0.08);border-color:rgba(0,242,255,0.3);}
.role-btn.selected{background:rgba(0,242,255,0.15);border-color:#00f2ff;}
.role-icon{font-size:1.6rem;margin-bottom:6px;}
.role-name{font-size:0.82rem;font-weight:700;color:#E2E2E2;}
.role-desc{font-size:0.7rem;color:#8892B0;margin-top:3px;}
/* PERSONALITY SLIDERS */
.tune-row{margin-bottom:16px;}
.tune-labels{display:flex;justify-content:space-between;margin-bottom:6px;}
.tune-label-l{font-size:0.78rem;color:#70E100;font-weight:600;}
.tune-label-r{font-size:0.78rem;color:#FF4B2B;font-weight:600;}
.tune-slider{width:100%;accent-color:#00f2ff;height:5px;cursor:pointer;}
.tune-val{text-align:center;font-size:0.75rem;color:#8892B0;margin-top:4px;}
/* DNA WORKFLOW */
.dna-task{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px;margin-bottom:10px;position:relative;}
.dna-task-row{display:flex;gap:10px;align-items:flex-start;}
.dna-task-num{width:22px;height:22px;border-radius:50%;background:rgba(112,225,0,0.2);border:1px solid rgba(112,225,0,0.4);color:#70E100;font-size:0.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.dna-task-fields{flex:1;display:flex;flex-direction:column;gap:8px;}
.dna-input{width:100%;background:#0d1117;border:1px solid rgba(255,255,255,0.1);color:#E2E2E2;border-radius:7px;padding:7px 10px;font-family:inherit;font-size:0.82rem;outline:none;}
.dna-input:focus{border-color:rgba(0,242,255,0.4);}
.dna-input-row{display:flex;gap:8px;}
.dna-task-del{position:absolute;top:10px;right:10px;background:rgba(255,75,43,0.15);border:1px solid rgba(255,75,43,0.3);color:#FF4B2B;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:0.72rem;}
.add-task-btn{background:rgba(112,225,0,0.1);border:1px dashed rgba(112,225,0,0.4);color:#70E100;border-radius:10px;padding:10px;width:100%;cursor:pointer;font-size:0.82rem;font-weight:700;transition:all 0.2s;}
.add-task-btn:hover{background:rgba(112,225,0,0.2);}
/* INTEGRITY GRID */
.integrity-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.int-card{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:12px;text-align:center;}
.int-label{font-size:0.7rem;color:#8892B0;letter-spacing:0.08em;margin-bottom:8px;}
.int-val{font-size:1.5rem;font-weight:800;color:#70E100;}
.int-slider{width:100%;accent-color:#70E100;margin-top:6px;}
.clearance-badge{padding:6px 14px;border-radius:20px;font-size:0.78rem;font-weight:700;display:inline-block;margin-top:10px;}
.cl-0{background:rgba(255,75,43,0.15);color:#FF4B2B;border:1px solid rgba(255,75,43,0.3);}
.cl-1{background:rgba(255,165,0,0.15);color:#FFA500;border:1px solid rgba(255,165,0,0.3);}
.cl-2{background:rgba(255,215,0,0.15);color:#FFD700;border:1px solid rgba(255,215,0,0.3);}
.cl-3{background:rgba(112,225,0,0.15);color:#70E100;border:1px solid rgba(112,225,0,0.3);}
.cl-4{background:rgba(0,242,255,0.15);color:#00f2ff;border:1px solid rgba(0,242,255,0.3);}
/* EMPTY STATE */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8892B0;gap:12px;}
.empty-icon{font-size:3rem;opacity:0.4;}
select.dna-input{cursor:pointer;}
@keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}

/* RNA Memory Block */
.rna-block {
    margin-top: 12px;
    border-top: 1px dashed rgba(0,242,255,0.2);
    padding-top: 10px;
}
.rna-block-header {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 8px;
    transition: background 0.2s;
    user-select: none;
}
.rna-block-header:hover { background: rgba(0,242,255,0.06); }
.rna-helix { font-size: 1rem; }
.rna-title { font-size: 0.75rem; font-weight: 700; color: #00f2ff; letter-spacing: 0.08em; flex: 1; }
.rna-toggle-icon { font-size: 0.7rem; color: #8892B0; }
.rna-body {
    display: flex;
    flex-direction: row;
    gap: 0;
    margin-top: 10px;
    background: rgba(0,242,255,0.03);
    border: 1px solid rgba(0,242,255,0.12);
    border-radius: 10px;
    overflow: hidden;
}
.rna-col {
    flex: 1;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.rna-col-label { font-size: 0.75rem; font-weight: 700; color: #A1C1D1; letter-spacing: 0.08em; }
.rna-col-sub { font-size: 0.7rem; color: #8892B0; }
.rna-textarea { height: 72px; resize: vertical; font-size: 0.78rem; }
.rna-tag-row { display: flex; align-items: center; gap: 8px; }
.rna-tag { font-size: 0.72rem; color: #8892B0; white-space: nowrap; }
.rna-mini-select { font-size: 0.75rem; padding: 4px 8px; }
.rna-divider { width: 1px; background: rgba(255,255,255,0.07); flex-shrink: 0; }
.rna-pref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rna-pref-item { display: flex; flex-direction: column; gap: 4px; }
.rna-pref-label { font-size: 0.7rem; color: #8892B0; }
.rna-memory-status { grid-column: 1/-1; }

</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">🧬 GRAEI AGENT DNA BUILDER</div>
    <div class="topbar-sub">Randall Role Governance — Positional AI Workflow Engine</div>
  </div>
  <div class="topbar-actions">
    <button class="btn-ghost" onclick="exportAgent()">📤 Export DNA</button>
    <button class="btn-primary" onclick="saveAgent()">💾 Save Agent</button>
  </div>
</div>

<div class="main">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-head">
      <span>AGENT ROSTER</span>
      <button class="add-agent-btn" onclick="newAgent()">+ Add Agent</button>
    </div>
    <div class="agent-list" id="agent-list">
      <div class="empty-state" style="padding:30px 10px;font-size:0.8rem;text-align:center;color:#8892B0;">
        No agents yet.<br>Click <b>+ Add Agent</b>
      </div>
    </div>
  </div>

  <!-- EDITOR -->
  <div class="editor" id="editor">
    <div class="empty-state">
      <div class="empty-icon">🧬</div>
      <div style="font-size:1rem;font-weight:700;color:#A1C1D1;">No Agent Selected</div>
      <div style="font-size:0.85rem;">Click <b>+ Add Agent</b> to create a new GRAEI agent</div>
      <button class="btn-primary" onclick="newAgent()" style="margin-top:8px;">+ Create First Agent</button>
    </div>
  </div>
</div>

<script>
const ROLES = [
  { id:'randall', icon:'🔵', name:'Randall Assistant', desc:'Top-level orchestrator', clearance:4 },
  { id:'sentinel',  icon:'🛡️', name:'Cyber Sentinel',     desc:'Security & threat monitor', clearance:3 },
  { id:'architect', icon:'⚙️', name:'Code Architect',      desc:'CI/CD & build systems', clearance:3 },
  { id:'librarian', icon:'📚', name:'Research Librarian',  desc:'Knowledge & vault access', clearance:2 },
  { id:'auditor',   icon:'📊', name:'Data Auditor',        desc:'Analytics & reporting', clearance:2 },
  { id:'creative',  icon:'🎨', name:'Creative Forge',      desc:'Ideation & content', clearance:1 },
  { id:'messenger', icon:'📡', name:'Cypher Messenger',    desc:'Ephemeral comms only', clearance:1 },
  { id:'janitor',   icon:'🧹', name:'System Janitor',      desc:'Cleanup & maintenance', clearance:0 },
];

const CLEARANCE_LABELS = ['RESTRICTED','STANDARD','ELEVATED','TRUSTED','RANDALL'];
const CLEARANCE_CLS    = ['cl-0','cl-1','cl-2','cl-3','cl-4'];

let agents = JSON.parse(localStorage.getItem('graei_agents') || '[]');
let currentId = null;

function saveToStorage() { localStorage.setItem('graei_agents', JSON.stringify(agents)); }

function newAgent() {
  const id = 'agent_' + Date.now();
  agents.push({
    id, name:'New Agent', roleId:'randall',
    personality:{ empathy:50, nice:50, professional:50 },
    tasks:[], integrity:5, valor:5, systemic:5
  });
  saveToStorage();
  renderSidebar();
  selectAgent(id);
}

function selectAgent(id) {
  currentId = id;
  document.querySelectorAll('.agent-chip').forEach(c => c.classList.toggle('active', c.dataset.id === id));
  renderEditor();
}

function getAgent() { return agents.find(a => a.id === currentId); }

function renderSidebar() {
  const list = document.getElementById('agent-list');
  if (!agents.length) { list.innerHTML = '<div style="padding:30px 10px;font-size:0.8rem;text-align:center;color:#8892B0;">No agents yet.<br>Click <b>+ Add Agent</b></div>'; return; }
  list.innerHTML = agents.map(a => {
    const role = ROLES.find(r => r.id === a.roleId) || ROLES[0];
    const clr = CLEARANCE_LABELS[role.clearance];
    const fill = (role.clearance / 4) * 100;
    return `<div class="agent-chip ${a.id===currentId?'active':''}" data-id="${a.id}" onclick="selectAgent('${a.id}')">
      <div class="agent-chip-name">${role.icon} ${a.name}</div>
      <div class="agent-chip-role">${role.name} · ${clr}</div>
      <div class="agent-chip-bar"><div class="agent-chip-fill" style="width:${fill}%"></div></div>
    </div>`;
  }).join('');
}

function renderEditor() {
  const a = getAgent();
  if (!a) return;
  const role = ROLES.find(r => r.id === a.roleId) || ROLES[0];
  const cl = role.clearance;
  const editor = document.getElementById('editor');
  editor.innerHTML = `
  <!-- STEP 1: NAME & ROLE -->
  <div class="step-card">
    <div class="step-header"><div class="step-num">1</div><div class="step-title">ROLE SELECTION</div></div>
    <div class="step-body">
      <div style="margin-bottom:14px;">
        <label style="font-size:0.75rem;color:#8892B0;display:block;margin-bottom:5px;">AGENT NAME</label>
        <input class="dna-input" style="max-width:300px;" value="${a.name}" oninput="updateName(this.value)" placeholder="Agent designation...">
      </div>
      <div class="role-grid">
        ${ROLES.map(r=>`
        <div class="role-btn ${a.roleId===r.id?'selected':''}" onclick="selectRole('${r.id}')">
          <div class="role-icon">${r.icon}</div>
          <div class="role-name">${r.name}</div>
          <div class="role-desc">${r.desc}</div>
          <div style="margin-top:6px;"><span class="clearance-badge ${CLEARANCE_CLS[r.clearance]}" style="font-size:0.65rem;padding:2px 8px;">${CLEARANCE_LABELS[r.clearance]}</span></div>
        </div>`).join('')}
      </div>
    </div>
  </div>

  <!-- STEP 2: PERSONALITY TUNING -->
  <div class="step-card">
    <div class="step-header"><div class="step-num">2</div><div class="step-title">PERSONALITY TUNING</div></div>
    <div class="step-body">
      <div class="tune-row">
        <div class="tune-labels"><span class="tune-label-l">🤝 Empathy</span><span class="tune-label-r">🧊 Cold/Strict</span></div>
        <input type="range" class="tune-slider" min="0" max="100" value="${a.personality.empathy}" oninput="updatePersonality('empathy',this.value,this)">
        <div class="tune-val" id="tune-empathy-val">${tuneLabel('empathy', a.personality.empathy)}</div>
      </div>
      <div class="tune-row">
        <div class="tune-labels"><span class="tune-label-l">😊 Nice</span><span class="tune-label-r">😈 Cruel</span></div>
        <input type="range" class="tune-slider" min="0" max="100" value="${a.personality.nice}" oninput="updatePersonality('nice',this.value,this)">
        <div class="tune-val" id="tune-nice-val">${tuneLabel('nice', a.personality.nice)}</div>
      </div>
      <div class="tune-row">
        <div class="tune-labels"><span class="tune-label-l">💼 Professional</span><span class="tune-label-r">🫂 Personal</span></div>
        <input type="range" class="tune-slider" min="0" max="100" value="${a.personality.professional}" oninput="updatePersonality('professional',this.value,this)">
        <div class="tune-val" id="tune-professional-val">${tuneLabel('professional', a.personality.professional)}</div>
      </div>
    </div>
  </div>

  <!-- STEP 3: DNA WORKFLOW -->
  <div class="step-card">
    <div class="step-header"><div class="step-num">3</div><div class="step-title">DNA WORKFLOW — Tasks · Abilities · Focal Points</div></div>
    <div class="step-body">
      <div id="task-list">${renderTasks(a.tasks)}</div>
      <button class="add-task-btn" onclick="addTask()">+ Add DNA Task Node</button>
    </div>
  </div>

  <!-- STEP 4: INTEGRITY & CLEARANCE GOVERNANCE -->
  <div class="step-card">
    <div class="step-header"><div class="step-num">4</div><div class="step-title">INTEGRITY · VALOR · SYSTEMIC GOVERNANCE</div></div>
    <div class="step-body">
      <div class="integrity-grid">
        <div class="int-card">
          <div class="int-label">INTEGRITY LEVEL</div>
          <div class="int-val" id="int-val">${a.integrity}</div>
          <input type="range" class="int-slider" min="0" max="10" value="${a.integrity}" oninput="updateStat('integrity',this.value)">
        </div>
        <div class="int-card">
          <div class="int-label">VALOR RATING</div>
          <div class="int-val" id="valor-val" style="color:#00f2ff;">${a.valor}</div>
          <input type="range" class="int-slider" style="accent-color:#00f2ff;" min="0" max="10" value="${a.valor}" oninput="updateStat('valor',this.value)">
        </div>
        <div class="int-card">
          <div class="int-label">SYSTEMIC STAT</div>
          <div class="int-val" id="systemic-val" style="color:#A1C1D1;">${a.systemic}</div>
          <input type="range" class="int-slider" style="accent-color:#A1C1D1;" min="0" max="10" value="${a.systemic}" oninput="updateStat('systemic',this.value)">
        </div>
        <div class="int-card">
          <div class="int-label">COMPUTED CLEARANCE</div>
          <div id="clearance-display">
            <div class="int-val" style="font-size:1.1rem;">${CLEARANCE_LABELS[cl]}</div>
            <span class="clearance-badge ${CLEARANCE_CLS[cl]}">${CLEARANCE_LABELS[cl]} · L${cl}</span>
          </div>
          <div style="font-size:0.7rem;color:#8892B0;margin-top:8px;">Governed by role.<br>Raise clearance → change role.</div>
        </div>
      </div>
      <div style="margin-top:16px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:14px;">
        <div style="font-size:0.75rem;color:#8892B0;margin-bottom:8px;letter-spacing:0.08em;">GOVERNANCE RULES FOR THIS AGENT</div>
        <div id="gov-rules" style="font-size:0.82rem;color:#E2E2E2;line-height:1.6;">${govRules(a)}</div>
      </div>
    </div>
  </div>
  `;
}

function tuneLabel(key, val) {
  const v = parseInt(val);
  const labels = {
    empathy:      v<25?'Cold/Strict':v<50?'Balanced-Firm':v<75?'Balanced-Warm':'Empathic',
    nice:         v<25?'Harsh':v<50?'Direct':v<75?'Friendly':'Very Nice',
    professional: v<25?'Personal':v<50?'Casual-Pro':v<75?'Professional':'Strictly Professional'
  };
  return `${v}% — ${labels[key]||''}`;
}


function renderTasks(tasks) {
  if (!tasks.length) return '<div style="color:#8892B0;font-size:0.82rem;text-align:center;padding:10px 0;">No tasks yet. Add a DNA task node below.</div>';
  return tasks.map((t,i)=>`
  <div class="dna-task" id="task-${i}">
    <div class="dna-task-row">
      <div class="dna-task-num">${i+1}</div>
      <div class="dna-task-fields">
        <input class="dna-input" placeholder="Task name / objective..." value="${t.name||''}" oninput="updateTask(${i},'name',this.value)">
        <div class="dna-input-row">
          <select class="dna-input" onchange="updateTask(${i},'ability',this.value)">
            <option value="">-- Select Ability --</option>
            ${['Read Vault','Write Vault','Execute Code','Scan Network','Encrypt Data','Send Message','Audit Log','Spawn Sub-Agent','Access Clearance Gate','Modify Config'].map(ab=>`<option value="${ab}" ${t.ability===ab?'selected':''}>${ab}</option>`).join('')}
          </select>
          <select class="dna-input" onchange="updateTask(${i},'focal',this.value)">
            <option value="">-- Focal Point --</option>
            ${['Security','Efficiency','Accuracy','Speed','Stealth','Compliance','Innovation','Preservation'].map(fp=>`<option value="${fp}" ${t.focal===fp?'selected':''}>${fp}</option>`).join('')}
          </select>
        </div>
        <input class="dna-input" placeholder="Description / execution logic..." value="${t.desc||''}" oninput="updateTask(${i},'desc',this.value)">
      </div>
    </div>
    <button class="dna-task-del" onclick="removeTask(${i})">✕</button>

    <!-- RNA MEMORY SUBSYSTEM -->
    <div class="rna-block">
      <div class="rna-block-header" onclick="toggleRna(${i})">
        <span class="rna-helix">🧬</span>
        <span class="rna-title">RNA MEMORY LAYER — Task ${i+1}</span>
        <span class="rna-toggle-icon" id="rna-icon-${i}">${t.rnaOpen?'▲':'▼'}</span>
      </div>
      <div class="rna-body" id="rna-body-${i}" style="display:${t.rnaOpen?'flex':'none'}">

        <!-- BUILD MEMORY -->
        <div class="rna-col">
          <div class="rna-col-label">🔨 BUILD MEMORY</div>
          <div class="rna-col-sub">Compile-time context saved for this task</div>
          <textarea class="dna-input rna-textarea" placeholder="e.g. Last compile state, dependency snapshot, environment variables, build flags..." oninput="updateTask(${i},'buildMemory',this.value)">${t.buildMemory||''}</textarea>
          <div class="rna-tag-row">
            <span class="rna-tag">Context Type:</span>
            <select class="dna-input rna-mini-select" onchange="updateTask(${i},'buildType',this.value)">
              <option value="">-- Type --</option>
              <option value="ephemeral" ${t.buildType==='ephemeral'?'selected':''}>Ephemeral (session-only)</option>
              <option value="persistent" ${t.buildType==='persistent'?'selected':''}>Persistent (vault-stored)</option>
              <option value="shared" ${t.buildType==='shared'?'selected':''}>Shared (team-accessible)</option>
              <option value="randall" ${t.buildType==='randall'?'selected':''}>Randall (owner-only)</option>
            </select>
          </div>
        </div>

        <div class="rna-divider"></div>

        <!-- AI-SPECIFIC MEMORY -->
        <div class="rna-col">
          <div class="rna-col-label">🤖 AI-SPECIFIC MEMORY</div>
          <div class="rna-col-sub">Agent's learned context for this task</div>
          <textarea class="dna-input rna-textarea" placeholder="e.g. User preferences observed, past outcomes, learned shortcuts, behavioral patterns..." oninput="updateTask(${i},'aiMemory',this.value)">${t.aiMemory||''}</textarea>
          <div class="rna-tag-row">
            <span class="rna-tag">Memory Scope:</span>
            <select class="dna-input rna-mini-select" onchange="updateTask(${i},'aiMemoryScope',this.value)">
              <option value="">-- Scope --</option>
              <option value="task" ${t.aiMemoryScope==='task'?'selected':''}>Task-Local</option>
              <option value="agent" ${t.aiMemoryScope==='agent'?'selected':''}>Agent-Wide</option>
              <option value="role" ${t.aiMemoryScope==='role'?'selected':''}>Role-Shared</option>
              <option value="global" ${t.aiMemoryScope==='global'?'selected':''}>Global Vault</option>
            </select>
          </div>
        </div>

        <div class="rna-divider"></div>

        <!-- COMPANY PREFERENCE -->
        <div class="rna-col">
          <div class="rna-col-label">🏢 COMPANY PREFERENCE</div>
          <div class="rna-col-sub">Controls memory allocation & positional state</div>
          <div class="rna-pref-grid">
            <div class="rna-pref-item">
              <div class="rna-pref-label">Memory Retention</div>
              <select class="dna-input rna-mini-select" onchange="updateTask(${i},'prefRetention',this.value)">
                <option value="30d" ${t.prefRetention==='30d'?'selected':''}>30 Days</option>
                <option value="90d" ${t.prefRetention==='90d'?'selected':''}>90 Days</option>
                <option value="1y" ${t.prefRetention==='1y'?'selected':''}>1 Year</option>
                <option value="permanent" ${t.prefRetention==='permanent'?'selected':''}>Permanent</option>
              </select>
            </div>
            <div class="rna-pref-item">
              <div class="rna-pref-label">Allocation Priority</div>
              <select class="dna-input rna-mini-select" onchange="updateTask(${i},'prefPriority',this.value)">
                <option value="low" ${t.prefPriority==='low'?'selected':''}>Low</option>
                <option value="standard" ${t.prefPriority==='standard'?'selected':''}>Standard</option>
                <option value="high" ${t.prefPriority==='high'?'selected':''}>High</option>
                <option value="critical" ${t.prefPriority==='critical'?'selected':''}>Critical</option>
              </select>
            </div>
            <div class="rna-pref-item">
              <div class="rna-pref-label">Positional State</div>
              <select class="dna-input rna-mini-select" onchange="updateTask(${i},'prefPosition',this.value)">
                <option value="active" ${t.prefPosition==='active'?'selected':''}>Active Deployment</option>
                <option value="standby" ${t.prefPosition==='standby'?'selected':''}>Standby Reserve</option>
                <option value="archived" ${t.prefPosition==='archived'?'selected':''}>Archived</option>
                <option value="training" ${t.prefPosition==='training'?'selected':''}>Training Mode</option>
              </select>
            </div>
            <div class="rna-pref-item">
              <div class="rna-pref-label">Memory Serves</div>
              <select class="dna-input rna-mini-select" onchange="updateTask(${i},'prefServes',this.value)">
                <option value="this_agent" ${t.prefServes==='this_agent'?'selected':''}>This Agent Only</option>
                <option value="same_role" ${t.prefServes==='same_role'?'selected':''}>Same-Role Agents</option>
                <option value="org" ${t.prefServes==='org'?'selected':''}>Entire Organization</option>
                <option value="randall" ${t.prefServes==='randall'?'selected':''}>Randall Owner Only</option>
              </select>
            </div>
          </div>
          <div class="rna-memory-status" id="rna-status-${i}">
            ${getRnaStatus(t)}
          </div>
        </div>

      </div>
    </div>
  </div>`).join('');
}

function getRnaStatus(t) {
  const priority = t.prefPriority || 'standard';
  const position = t.prefPosition || 'active';
  const serves = t.prefServes || 'this_agent';
  const colors = { low:'#8892B0', standard:'#A1C1D1', high:'#70E100', critical:'#FF4B2B' };
  const c = colors[priority] || '#A1C1D1';
  return `<div style="font-size:0.72rem;color:#8892B0;margin-top:8px;padding:8px;background:rgba(0,0,0,0.3);border-radius:6px;border-left:2px solid ${c};">
    Memory allocation: <b style="color:${c}">${priority.toUpperCase()}</b> priority · 
    State: <b style="color:#A1C1D1">${position}</b> · 
    Serves: <b style="color:#00f2ff">${serves.replace('_',' ')}</b>
  </div>`;
}

function toggleRna(i) {
  const a = getAgent(); if(!a || !a.tasks[i]) return;
  a.tasks[i].rnaOpen = !a.tasks[i].rnaOpen;
  saveToStorage();
  const body = document.getElementById(`rna-body-${i}`);
  const icon = document.getElementById(`rna-icon-${i}`);
  if (body) body.style.display = a.tasks[i].rnaOpen ? 'flex' : 'none';
  if (icon) icon.textContent = a.tasks[i].rnaOpen ? '▲' : '▼';
}

function removeTask(i) {
  const a=getAgent(); if(!a)return;
  a.tasks.splice(i,1);
  saveToStorage();
  const tl=document.getElementById('task-list');
  if(tl) tl.innerHTML=renderTasks(a.tasks);
}
function updateTask(i,key,val) { const a=getAgent(); if(!a)return; a.tasks[i][key]=val; saveToStorage(); }
function saveAgent() { saveToStorage(); renderSidebar(); alert('Agent DNA saved to Randall Vault.'); }
function exportAgent() {
  const a=getAgent(); if(!a){alert('Select an agent first.');return;}
  const blob=new Blob([JSON.stringify(a,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const lnk=document.createElement('a'); lnk.href=url; lnk.download=`${a.name.replace(/\s+/g,'_')}_DNA.json`; lnk.click();
}

renderSidebar();
</script>
</body>
</html>
