<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quick Vault — Sovereign Storage</title>
  <meta name="description" content="Desktop Quick Vault: compress and archive your files to reclaim disk space with sovereign-grade security."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vault.css"/>
</head>
<body>

  <!-- Ambient background particles -->
  <div class="ambient" id="ambient"></div>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="20,2 38,11 38,29 20,38 2,29 2,11" stroke="url(#grad1)" stroke-width="2" fill="none"/>
          <circle cx="20" cy="20" r="7" stroke="url(#grad1)" stroke-width="1.5" fill="none"/>
          <circle cx="20" cy="20" r="3" fill="url(#grad1)"/>
          <line x1="20" y1="13" x2="20" y2="10" stroke="url(#grad1)" stroke-width="1.5"/>
          <line x1="20" y1="30" x2="20" y2="27" stroke="url(#grad1)" stroke-width="1.5"/>
          <line x1="13" y1="20" x2="10" y2="20" stroke="url(#grad1)" stroke-width="1.5"/>
          <line x1="30" y1="20" x2="27" y2="20" stroke="url(#grad1)" stroke-width="1.5"/>
          <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#00f5d4"/>
              <stop offset="100%" style="stop-color:#7b61ff"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-name">Quick<span class="accent">Vault</span></span>
        <span class="logo-sub">Sovereign Storage System</span>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-pill" id="stat-files">
        <span class="stat-num" id="total-files">0</span>
        <span class="stat-label">Files</span>
      </div>
      <div class="stat-pill" id="stat-saved">
        <span class="stat-num" id="total-saved">0 B</span>
        <span class="stat-label">Saved</span>
      </div>
      <div class="stat-pill accent-pill">
        <span class="stat-num" id="compress-ratio">0%</span>
        <span class="stat-label">Ratio</span>
      </div>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <main class="main-layout">

    <!-- LEFT: Drop Zone + Controls -->
    <section class="panel left-panel">
      <h2 class="panel-title">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1v10M4 7l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="2" y="12" width="12" height="2" rx="1" fill="currentColor"/></svg>
        Drop Files Here
      </h2>

      <!-- Drop Zone -->
      <div class="drop-zone" id="drop-zone">
        <div class="drop-inner">
          <div class="drop-icon-wrap">
            <svg class="drop-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M32 8L32 42" stroke="url(#dg)" stroke-width="3" stroke-linecap="round"/>
              <path d="M18 28L32 42L46 28" stroke="url(#dg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 46H52" stroke="url(#dg)" stroke-width="3" stroke-linecap="round"/>
              <defs>
                <linearGradient id="dg" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#00f5d4"/>
                  <stop offset="1" stop-color="#7b61ff"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <p class="drop-title">Drag & Drop Files</p>
          <p class="drop-subtitle">or click to browse</p>
          <button class="btn-browse" id="btn-browse">Browse Files</button>
          <input type="file" id="file-input" multiple hidden/>
        </div>
        <div class="drop-overlay" id="drop-overlay">
          <span>Release to Vault</span>
        </div>
      </div>

      <!-- Compression Settings -->
      <div class="settings-card">
        <h3 class="settings-title">⚙ Vault Settings</h3>
        <div class="setting-row">
          <label>Compression Level</label>
          <div class="slider-wrap">
            <input type="range" id="compress-level" min="1" max="9" value="6" class="slider"/>
            <span class="slider-val" id="compress-val">6</span>
          </div>
        </div>
        <div class="setting-row">
          <label>Vault Tag</label>
          <input type="text" id="vault-tag" class="text-input" placeholder="e.g. Documents, Media..." value="General"/>
        </div>
        <div class="setting-row">
          <label>Auto-Delete Original</label>
          <label class="toggle">
            <input type="checkbox" id="auto-delete"/>
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
      </div>

      <!-- Vault it button -->
      <button class="btn-vault" id="btn-vault" disabled>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><polygon points="9,1 17,5 17,13 9,17 1,13 1,5" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="9" r="3" fill="currentColor"/></svg>
        Vault Selected Files
      </button>
    </section>

    <!-- RIGHT: Vault Contents -->
    <section class="panel right-panel">
      <div class="panel-header">
        <h2 class="panel-title">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 3V2a2 2 0 014 0v1" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="9" r="1.5" fill="currentColor"/></svg>
          Vault Contents
        </h2>
        <div class="panel-actions">
          <input type="text" id="search-vault" class="search-input" placeholder="🔍  Search vault..."/>
          <button class="btn-icon" id="btn-export-all" title="Export All">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8v5h10V8M8 1v8M5 5l3-3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn-icon danger" id="btn-clear-all" title="Clear All">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6 4V3h4v1M5 4v9h6V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <!-- Category tabs -->
      <div class="tabs" id="category-tabs">
        <button class="tab active" data-cat="all">All</button>
      </div>

      <!-- File list -->
      <div class="vault-list" id="vault-list">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">🔐</div>
          <p>Your vault is empty</p>
          <span>Drop files on the left to vault them</span>
        </div>
      </div>

      <!-- Storage Bar -->
      <div class="storage-bar-wrap">
        <div class="storage-labels">
          <span>Vault Storage Used</span>
          <span id="storage-used-label">0 B / ∞</span>
        </div>
        <div class="storage-bar">
          <div class="storage-fill" id="storage-fill" style="width:0%"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- ===== TOAST ===== -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ===== PREVIEW MODAL ===== -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">File Details</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="modal-extract">Extract File</button>
        <button class="btn-danger" id="modal-delete">Delete from Vault</button>
      </div>
    </div>
  </div>

  <script src="vault.js"></script>
</body>
</html>
