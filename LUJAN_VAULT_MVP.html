<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUJAN VAULT | Deductive Demo MVP</title>
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --bg: #050508;
            --surface: #0f0f1a;
            --text: #e0e0f0;
            --accent: #ff00c8;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: -1;
            opacity: 0.2;
        }

        .container {
            width: 900px;
            background: rgba(15, 15, 26, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .logo h1 {
            font-size: 24px;
            margin: 0;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            font-size: 10px;
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--primary);
            padding: 4px 12px;
            border-radius: 100px;
            color: var(--primary);
            text-transform: uppercase;
        }

        .drop-zone {
            height: 300px;
            border: 2px dashed rgba(0, 242, 255, 0.3);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.dragover {
            background: rgba(0, 242, 255, 0.05);
            border-color: var(--primary);
        }

        .drop-zone p { font-size: 14px; opacity: 0.6; }
        .drop-zone .icon { font-size: 48px; margin-bottom: 10px; opacity: 0.8; }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
        }

        .toggle {
            cursor: pointer;
            width: 40px;
            height: 20px;
            background: #333;
            border-radius: 20px;
            position: relative;
            transition: 0.3s;
        }

        .toggle::after {
            content: '';
            position: absolute;
            left: 2px; top: 2px;
            width: 16px; height: 16px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle.active { background: var(--primary); }
        .toggle.active::after { left: 22px; }

        .btn-crunch {
            background: linear-gradient(45deg, #00f2ff, #005eff);
            border: none;
            color: white;
            padding: 18px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 20px rgba(0, 242, 255, 0.2);
            transition: 0.3s;
        }

        .btn-crunch:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0, 242, 255, 0.4); }
        .btn-crunch:active { transform: translateY(1px); }

        .output-panel {
            grid-column: 1 / -1;
            background: #000;
            border-radius: 16px;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            overflow-y: auto;
            max-height: 200px;
            border: 1px solid rgba(255,255,255,0.05);
            display: none;
        }

        .output-panel.active { display: block; }

        .stats {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 10px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card .val { font-size: 20px; font-weight: bold; color: var(--primary); display: block; }
        .stat-card .lbl { font-size: 10px; opacity: 0.5; text-transform: uppercase; }

        #visualizer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: none;
        }

        .glitch { animation: glitch 0.5s infinite; }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 1px); }
            40% { transform: translate(-2px, -1px); }
            60% { transform: translate(2px, 1px); }
            80% { transform: translate(2px, -1px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container" id="app">
    <div class="header">
        <div class="logo">
            <h1>LUJAN DEDUCTIVE VAULT</h1>
            <div style="font-size: 10px; opacity: 0.4;">v1.2.2-PATENT-TRACK</div>
        </div>
        <div class="badge">Sovereign Data Shield</div>
    </div>

    <div class="drop-zone" id="drop-zone">
        <canvas id="visualizer"></canvas>
        <div class="icon">📁</div>
        <p id="file-info">Drag & Drop Dataset or Audit Log</p>
        <input type="file" id="file-input" style="display: none;">
    </div>

    <div class="controls">
        <div class="setting">
            <span>Deductive Triangulation</span>
            <div class="toggle active" id="toggle-tri"></div>
        </div>
        <div class="setting">
            <span>Double-Crunch Core (90%)</span>
            <div class="toggle" id="toggle-crunch"></div>
        </div>
        <div class="setting">
            <span>Integrity Locking (SHA256)</span>
            <div class="toggle active" id="toggle-sha"></div>
        </div>
        <button class="btn-crunch" id="btn-crunch">Initialize Vault</button>
    </div>

    <div class="output-panel" id="output">
        <div style="color: var(--primary)">> INITIALIZING LUJAN DEDUCTIVE SCANNER...</div>
    </div>

    <div class="stats">
        <div class="stat-card"><span class="val" id="stat-orig">0</span><span class="lbl">Original Bytes</span></div>
        <div class="stat-card"><span class="val" id="stat-stored">0</span><span class="lbl">Vault Symbols</span></div>
        <div class="stat-card"><span class="val" id="stat-density">0%</span><span class="lbl">Density Gain</span></div>
        <div class="stat-card"><span class="val" id="stat-status">IDLE</span><span class="lbl">Engine Status</span></div>
    </div>
</div>

<script>
// --- CORE ENGINE SEED ---
const PATTERN = [1, 4, 2, 8, 5, 7];
const KEYBOARD = "`1234567890-=~!@#$%^&*()_+qwertyuiop[]\\QWERTYUIOP{}|asdfghjkl;'ASDFGHJKL:\"zxcvbnm,./ZXCVBNM<>? \t\n";

class LujanDemoEngine {
    static crunch(data, recursive = false) {
        // Simplified Browser Engine for the Demo
        let size = data.length;
        let stored = Math.floor(size * (recursive ? 0.08 : 0.21)); // Simulate deductive patterns
        if (size < 100) stored = size + 5; // Header overhead for small files
        return stored;
    }
}

// --- UI LOGIC ---
const app = {
    file: null,
    recursive: false,
    
    init() {
        this.bindEvents();
        this.initVisuals();
    },

    bindEvents() {
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const btn = document.getElementById('btn-crunch');
        const toggleCrunch = document.getElementById('toggle-crunch');

        dropZone.onclick = () => fileInput.click();
        
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('dragover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            this.handleFile(e.dataTransfer.files[0]);
        };

        fileInput.onchange = (e) => this.handleFile(e.target.files[0]);

        toggleCrunch.onclick = () => {
            this.recursive = !this.recursive;
            toggleCrunch.classList.toggle('active', this.recursive);
        };

        btn.onclick = () => this.execute();
    },

    handleFile(file) {
        if (!file) return;
        this.file = file;
        document.getElementById('file-info').innerText = `${file.name} (${(file.size/1024).toFixed(1)} KB)`;
        document.getElementById('stat-orig').innerText = file.size.toLocaleString();
        this.log(`FILE DETECTED: ${file.name}`);
    },

    log(msg) {
        const out = document.getElementById('output');
        out.style.display = 'block';
        const div = document.createElement('div');
        div.innerText = `> ${msg}`;
        out.appendChild(div);
        out.scrollTop = out.scrollHeight;
    },

    execute() {
        if (!this.file) { alert("Please drop a file first."); return; }

        this.startVisualization();
        document.getElementById('stat-status').innerText = "CRUNCHING...";
        this.log(`COMMENCING DEDUCTIVE SCAN...`);
        
        setTimeout(() => {
            this.log(`APPLYING PATTERN [1, 4, 2, 8, 5, 7]...`);
        }, 800);

        setTimeout(() => {
            if(this.recursive) this.log(`IDENTIFIED RECURSIVE LAYERS. EXECUTING DOUBLE-CRUNCH...`);
            
            const stored = LujanDemoEngine.crunch(this.file, this.recursive);
            const savings = 100 * (1 - (stored / this.file.size));

            document.getElementById('stat-stored').innerText = stored.toLocaleString();
            document.getElementById('stat-density').innerText = `${savings.toFixed(2)}%`;
            document.getElementById('stat-status').innerText = "SECURED";
            this.log(`VAULT COMPLETE. BIT-PERFECT FRAGMENT SECURED.`);
            this.stopVisualization();
            
            if (this.recursive) {
                document.getElementById('stat-status').classList.add('glitch');
                this.log(`ULTIMATE DENSITY ATTAINED: .0006 RATIO TARGET MET.`);
            }
        }, 2500);
    },

    initVisuals() {
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function draw() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00f2ff';
            ctx.font = '10px Courier';
            for(let i=0; i<50; i++) {
                ctx.fillText(KEYBOARD[Math.floor(Math.random()*KEYBOARD.length)], Math.random()*canvas.width, Math.random()*canvas.height);
            }
            requestAnimationFrame(draw);
        }
        draw();
    },

    startVisualization() {
        const v = document.getElementById('visualizer');
        v.style.display = 'block';
        // Add fancy lines/grid during crunch
    },
    stopVisualization() {
        // Stop animation
    }
};

app.init();

</script>
</body>
</html>
