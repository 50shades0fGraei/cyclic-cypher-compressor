<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lujan Deductive Vault | Double Crunch Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-mesh"></div>
    <div class="container">
        <header>
            <h1>Randall Deductive Vault</h1>
            <p>99% Density Double Crunch Marketplace Extraction</p>
        </header>

        <main>
            <div class="panel upload-panel">
                <h2>Import Asset</h2>
                <div class="drop-zone" id="drop-zone">
                    <span class="drop-icon">✧</span>
                    <p>Drag & Drop or <strong>Click to Browse</strong><br /><small>(Select 6+ items for Max Density
                            Bundling)</small></p>
                    <input type="file" id="file-input" multiple hidden>
                </div>

                <div class="input-group">
                    <label>Assigned CDV6 Label</label>
                    <input type="text" id="file-label" placeholder="e.g. Q3 Financial Report">
                </div>

                <button class="btn btn-primary" id="crunch-btn" disabled>Execute Double Crunch</button>
            </div>

            <div class="panel list-panel">
                <h2>CDV6 Encrypted Storage</h2>
                <div class="file-list" id="file-list">
                    <!-- Dynamic File Items Render Here -->
                </div>
            </div>
        </main>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileLabel = document.getElementById('file-label');
        const crunchBtn = document.getElementById('crunch-btn');
        const fileList = document.getElementById('file-list');

        let selectedFiles = [];

        // Fetch and render files
        async function loadFiles() {
            const res = await fetch('/api/files');
            const data = await res.json();

            fileList.innerHTML = '';

            if (data.files.length === 0) {
                fileList.innerHTML = '<p class="empty-state">No CDV6 artifacts stored yet.</p>';
            }

            data.files.forEach(f => {
                const item = document.createElement('div');
                item.className = 'file-item';

                let actionsHTML = '';

                if (f.rebuilt_exists) {
                    actionsHTML = `
                        <div class="status-indicator">✅ Rebuild Verified</div>
                        <a href="/api/download/${f.id}" class="btn btn-sm btn-outline" download>Download</a>
                        <button class="btn btn-sm btn-delete outline" onclick="deleteRebuilt('${f.id}')">Discard Rebuilt</button>
                    `;
                } else {
                    actionsHTML = `
                        <button class="btn btn-sm btn-restore" onclick="restoreFile('${f.id}')">Restore Original</button>
                    `;
                }

                item.innerHTML = `
                    <div class="file-info">
                        <strong>${f.label}</strong>
                        <span class="subtext">${f.original_filename} &rarr; CDV6 (60 Bytes)</span>
                    </div>
                    <div class="file-actions">
                        <a href="/api/download/cdv6/${f.id}" class="btn btn-sm btn-outline" download>Download CDV6</a>
                        ${actionsHTML}
                        <button class="btn btn-sm btn-delete" onclick="deleteCdv6('${f.id}')">Delete Artifact</button>
                    </div>
                `;
                fileList.appendChild(item);
            });
        }

        // Drag & Drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                selectedFiles = Array.from(e.dataTransfer.files);
                updateDropZoneText();
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                selectedFiles = Array.from(e.target.files);
                updateDropZoneText();
            }
        });

        function updateDropZoneText() {
            if (selectedFiles.length > 0) {
                if (selectedFiles.length === 1) {
                    dropZone.querySelector('p').innerText = `Selected: ${selectedFiles[0].name}`;
                    if (!fileLabel.value) fileLabel.value = selectedFiles[0].name.split('.')[0];
                } else {
                    dropZone.querySelector('p').innerHTML = `Selected: ${selectedFiles.length} files <strong style="color:#aa44ff">[BUNDLE READY]</strong>`;
                    if (!fileLabel.value) fileLabel.value = `Asset Bundle (${selectedFiles.length} items)`;
                }
                crunchBtn.removeAttribute('disabled');
            }
        }

        // Upload
        crunchBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            crunchBtn.innerText = 'Crunching...';
            crunchBtn.setAttribute('disabled', true);

            const formData = new FormData();
            selectedFiles.forEach(f => formData.append('files', f));
            formData.append('label', fileLabel.value || 'Unnamed Asset');

            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    selectedFiles = [];
                    fileInput.value = '';
                    fileLabel.value = '';
                    dropZone.querySelector('p').innerHTML = 'Drag & Drop or <strong>Click to Browse</strong><br/><small>(Select 6+ items for Max Density Bundling)</small>';
                    crunchBtn.innerText = 'Execute Double Crunch';
                    loadFiles();
                } else {
                    alert('Compression failed.');
                }
            } catch (e) {
                alert('Connection error.');
            }
        });

        // Actions
        async function restoreFile(id) {
            await fetch(`/api/restore/${id}`, { method: 'POST' });
            loadFiles();
        }

        async function deleteCdv6(id) {
            if (confirm('Permanently delete this encrypted CDV6 artifact?')) {
                await fetch(`/api/files/${id}`, { method: 'DELETE' });
                loadFiles();
            }
        }

        async function deleteRebuilt(id) {
            await fetch(`/api/rebuilt/${id}`, { method: 'DELETE' });
            loadFiles();
        }

        // Init
        loadFiles();
    </script>
</body>

</html>
